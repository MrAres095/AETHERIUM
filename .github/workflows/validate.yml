name: AETHERIUM validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run Grinder unit tests
        run: node --test tools/test_grinder_processor.js tools/test_grinder_transaction.js tools/test_upgrade_evaluator.js tools/test_grinder_registry.js tools/test_machine_registry.js tools/test_industry_catalogue.js tools/test_power_quarry_design.js tools/test_energy_ledger.js tools/test_battery_state.js tools/test_battery_interface.js tools/test_power_dispatch.js tools/test_power_network.js tools/test_power_buffer.js tools/test_tool_battery_state.js tools/test_manual_grinder.js tools/test_power_generation.js tools/test_farming_system.js tools/test_item_transfer.js tools/test_logistics_config.js tools/test_logistics_state.js tools/test_logistics_machine.js tools/test_logistics_drop_payload.js tools/test_logistics_lifecycle.js
      - name: Run pack-validator unit tests
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Validate Bedrock pack structure
        run: python tools/validate_pack.py
