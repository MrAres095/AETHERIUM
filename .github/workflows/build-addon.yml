name: Build AETHERIUM addon

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-addon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run unit tests
        run: |
          node --test tools/test_energy_ledger.js tools/test_battery_state.js tools/test_grinder_processor.js tools/test_grinder_transaction.js tools/test_upgrade_evaluator.js tools/test_item_transfer.js tools/test_logistics_config.js tools/test_logistics_state.js tools/test_logistics_machine.js tools/test_logistics_drop_payload.js tools/test_logistics_lifecycle.js
          python3 -m unittest discover -s tools -p "test_*.py" -v
      - name: Build .mcaddon
        run: python3 tools/build_mcaddon.py
      - name: Upload Android-importable addon
        uses: actions/upload-artifact@v4
        with:
          name: AETHERIUM-0.3.3-mcaddon
          path: dist/*.mcaddon
          if-no-files-found: error
          retention-days: 30
